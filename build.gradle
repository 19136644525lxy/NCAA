plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	
	// Mod Menu and Cloth Config API repositories
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Shedaniel's Maven"
		url = "https://maven.shedaniel.me/"
	}
}

// Fabric API configuration

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// Mod Menu and Cloth Config API for configuration UI
	modImplementation "com.terraformersmc:modmenu:7.2.2"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:11.1.136"

	// YFCoreLib：仓库里 libs/ 自带一份生产 jar（intermediary），保证 clone 下来就能构建。
	// 若按本仓布局存在最新构建产物（../../fabric/build/libs/），优先用它，方便本地联调。
	// 必须用 modImplementation：Loom 才会把 intermediary 包重映射成 Yarn 视图；用 implementation 会编译期找不到类。
	def yfcorelibBuilt = file("../../fabric/build/libs/yfcorelib-fabric-1.20.1-0.2.0.jar")
	def yfcorelibJar = yfcorelibBuilt.exists() ? yfcorelibBuilt : file("libs/yfcorelib-fabric-1.20.1-0.2.0.jar")
	modImplementation files(yfcorelibJar)
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Mixin 的 refmap：生产环境里 Mixin 必须靠 refmap 把 @Inject(method = "execute") 这类
// Yarn 名字翻译成 intermediary 名字，否则注入目标找不到，required=true 会直接崩。
// fabric-loom 1.14 默认不再跑旧版 Mixin 注解处理器，这里显式打开并指定 refmap 名。
loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "ncaa-refmap.json"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}